<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&Princess | &Princess Event Plan</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', YuMincho, serif;
            background-image: url('IMG_4855.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 15px 35px rgba(100, 70, 100, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.6);
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #a78bfa, #d4af37);
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(167, 139, 250, 0.3);
        }
        h1 {
            color: #4a2e35;
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        p {
            color: #554a4d;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 30px;
            text-align: left;
            padding: 0 10px;
        }
        .btn-container {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            flex: 1;
            text-align: center;
            padding: 14px 10px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .btn-line {
            background: linear-gradient(135deg, #34d399, #059669);
        }
        .btn-email {
            background: linear-gradient(135deg, #f59e0b, #d4af37);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="badge">Event Plan</div>
            <h1>&Princess</h1>
            <p>商業施設や代理店様向けの高精度なドレスアップ＆フォトブース体験サービス。夢のような空間をお届けします。</p>
            <div class="btn-container">
                <a href="https://line.me" class="btn btn-line">LINEで相談</a>
                <a href="mailto:example@example.com" class="btn btn-email">メールで問い合わせ</a>
            </div>
        </div>
    </div>
</body>
</html>
