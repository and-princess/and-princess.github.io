<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&Princess | &Princess Event Plan</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', YuMincho, serif;
            background-image: url('IMG_4855.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 215, 0, 0.5);
        }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #50c878, #ffd700);
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        h1 {
            color: #4a2e35;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            line-height: 1.6;
        }
        .btn-container {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            color: #fff;
        }
        .btn-line {
            background-color: #06c755;
        }
        .btn-email {
            background-color: #d4af37;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="badge">Event Plan</div>
            <h1>&Princess</h1>
            <p>商業施設や代理店様向けの高精度なドレスアップ＆フォトブース体験サービス。夢のような空間をお届けします。</p>
            <div class="btn-container">
                <a href="https://line.me" class="btn btn-line">LINEで相談</a>
                <a href="mailto:example@example.com" class="btn btn-email">メールで問い合わせ</a>
            </div>
        </div>
    </div>
</body>
</html>
