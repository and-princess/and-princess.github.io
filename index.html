<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&Princess (アンドプリンセス)</title>
    <style>
        :root {
            --color-text-main: #4a3b32;
            --color-text-sub: #726378;
            --color-gold: #dfb15b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--color-text-main);
            margin: 0;
            padding: 0;
            background-color: #fcfbfa;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }
        /* お問い合わせカード */
        .cta-container {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .cta-button {
            display: block;
            background: var(--color-gold);
            color: #fff;
            padding: 14px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(223,177,91,0.3);
        }
        .cta-button.sub {
            background: #726378;
            box-shadow: 0 2px 8px rgba(114,99,120,0.3);
        }
        /* ギャラリーカード */
        .gallery-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            padding-bottom: 15px;
        }
        .gallery-image {
            width: 100%;
            height: 220px;
            background: #eee;
        }
        .gallery-card p {
            margin: 12px 0 0 0;
            color: var(--color-text-sub);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>&Princess</h1>
        
        <!-- お問い合わせカード -->
        <div class="cta-container">
            <a href="#" class="cta-button">✨ 公式LINEでお問い合わせ</a>
            <a href="#" class="cta-button sub">✉️ メールでお問い合わせ</a>
        </div>

        <!-- イベント風用の写真カード -->
        <div class="gallery-card">
            <div class="gallery-image"></div>
            <p>イベント風景 01</p>
        </div>
    </div>
</body>
</html>
